<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__TITLE__</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --ink: #1f2937; --ink2: #6b7280; --line: #e5e7eb;
    --accent: #dc2626;
    --c-incident: #dc2626; --c-damage: #ea580c; --c-community: #d97706;
    --c-command: #4338ca; --c-resource: #0d9488; --c-risk: #7c3aed;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--bg); color: var(--ink); font-size: 14px; line-height: 1.65;
  }
  header { background: linear-gradient(135deg, #111827 0%, #1f2937 55%, #42200b 100%); color: #fff; padding: 18px 28px; }
  .h-top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .h-brand { font-size: 11px; letter-spacing: 2px; color: #fca5a5; border: 1px solid #7f1d1d; padding: 2px 10px; border-radius: 999px; background: rgba(220,38,38,.18); white-space: nowrap; }
  h1 { font-size: 22px; font-weight: 700; letter-spacing: .5px; }
  .h-status { display: flex; gap: 8px; }
  .pill { font-size: 12px; padding: 2px 12px; border-radius: 999px; font-weight: 600; }
  .pill.active { background: #dc2626; color: #fff; }
  .pill.monitoring { background: #d97706; color: #fff; }
  .pill.closed { background: #6b7280; color: #fff; }
  .pill.extreme { background: rgba(127,29,29,.6); color: #fecaca; border: 1px solid #dc2626; }
  .pill.severe { background: rgba(124,45,18,.6); color: #fed7aa; border: 1px solid #ea580c; }
  .pill.mod { background: rgba(107,114,128,.4); color: #e5e7eb; border: 1px solid #9ca3af; }
  .pill.minor { background: rgba(107,114,128,.4); color: #e5e7eb; border: 1px solid #9ca3af; }
  .h-meta { margin-top: 8px; font-size: 12.5px; color: #d1d5db; display: flex; gap: 22px; flex-wrap: wrap; }
  .h-meta b { color: #fff; font-weight: 600; }
  .lang-btn {
    position: absolute; top: 18px; right: 24px; z-index: 1200;
    font-size: 12.5px; font-weight: 700; letter-spacing: .5px; cursor: pointer;
    color: #fde68a; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.25);
    border-radius: 999px; padding: 4px 14px; user-select: none;
  }
  .lang-btn:hover { background: rgba(255,255,255,.18); }
  .wrap { max-width: 1440px; margin: 0 auto; padding: 18px 22px 40px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; border-top: 3px solid var(--accent); }
  .kpi .v { font-size: 30px; font-weight: 800; color: var(--accent); line-height: 1.1; }
  .kpi .v small { font-size: 13px; font-weight: 600; color: var(--ink2); margin-left: 2px; }
  .kpi .l { font-size: 13px; font-weight: 600; margin-top: 4px; }
  .kpi .n { font-size: 11.5px; color: var(--ink2); margin-top: 2px; }
  .main { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(320px, 1fr); gap: 16px; }
  @media (max-width: 980px) { .main { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .card h2 { font-size: 14px; font-weight: 700; padding: 10px 16px; border-bottom: 1px solid var(--line); background: #fafafa; display: flex; align-items: center; gap: 8px; }
  .card h2::before { content: ""; width: 4px; height: 14px; background: var(--accent); border-radius: 2px; display: inline-block; }
  #map { height: 560px; width: 100%; }
  .legend { position: absolute; right: 10px; bottom: 10px; z-index: 1000; background: rgba(255,255,255,.95); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font-size: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  .legend .row { display: flex; align-items: center; gap: 7px; padding: 1px 0; cursor: pointer; user-select: none; }
  .legend .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .legend .row.off { opacity: .35; text-decoration: line-through; }
  .side { display: flex; flex-direction: column; gap: 16px; }
  .summary-body { padding: 12px 16px; font-size: 13.5px; color: #374151; }
  .tl { padding: 10px 16px 14px; max-height: 320px; overflow-y: auto; }
  .tl-item { position: relative; padding: 0 0 14px 18px; border-left: 2px solid var(--line); margin-left: 6px; }
  .tl-item:last-child { padding-bottom: 0; }
  .tl-item::before { content: ""; position: absolute; left: -6px; top: 5px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); border: 2px solid #fff; box-shadow: 0 0 0 1px var(--accent); }
  .tl-time { font-size: 12px; font-weight: 700; color: var(--accent); }
  .tl-tag { font-size: 10.5px; background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; border-radius: 4px; padding: 0 5px; margin-left: 6px; }
  .tl-text { font-size: 13px; color: #374151; margin-top: 2px; }
  .res-list { padding: 8px 16px 14px; }
  .res-item { padding: 8px 0; border-bottom: 1px dashed var(--line); }
  .res-item:last-child { border-bottom: none; }
  .res-name { font-weight: 700; font-size: 13.5px; }
  .res-type { font-size: 11px; color: #0f766e; background: #f0fdfa; border: 1px solid #ccfbf1; border-radius: 4px; padding: 0 6px; margin-left: 6px; }
  .res-detail { font-size: 12.5px; color: var(--ink2); }
  .src-list { padding: 10px 16px 14px; font-size: 12.5px; }
  .src-list li { margin: 4px 0 4px 16px; }
  .src-list a { color: #2563eb; text-decoration: none; word-break: break-all; }
  .src-list a:hover { text-decoration: underline; }
  .chart-body { padding: 12px 16px 6px; }
  .chart-note { font-size: 11.5px; color: var(--ink2); padding: 0 16px 12px; }
  footer { text-align: center; color: var(--ink2); font-size: 12px; padding: 18px 20px 30px; }
  footer b { color: #b91c1c; }
  .leaflet-popup-content { font-size: 12.5px; }
  .pop-name { font-weight: 700; font-size: 13px; margin-bottom: 2px; }
  .pop-cat { display: inline-block; font-size: 10.5px; color: #fff; border-radius: 4px; padding: 0 6px; margin-bottom: 4px; }
</style>
</head>
<body>
<header>
  <span class="lang-btn" id="lang-btn" onclick="toggleLang()" title="Switch language / 切换语言"></span>
  <div class="h-top">
    <span class="h-brand" id="brand"></span>
    <h1 id="ev-title"></h1>
    <span class="h-status" id="ev-status"></span>
  </div>
  <div class="h-meta" id="ev-meta"></div>
</header>

<div class="wrap">
  <div class="kpis" id="kpis"></div>

  <div class="main">
    <div class="card">
      <h2><span id="t-map"></span> <span style="font-weight:400;color:#6b7280;font-size:12px;" id="t-map-hint"></span></h2>
      <div id="map"></div>
    </div>

    <div class="side">
      <div class="card">
        <h2 id="t-summary"></h2>
        <div class="summary-body" id="ev-summary"></div>
      </div>

      <div class="card" id="chart-card">
        <h2 id="t-chart"></h2>
        <div class="chart-body" id="chart"></div>
        <div class="chart-note" id="t-chart-note"></div>
      </div>

      <div class="card">
        <h2 id="t-timeline"></h2>
        <div class="tl" id="timeline"></div>
      </div>

      <div class="card">
        <h2 id="t-resources"></h2>
        <div class="res-list" id="resources"></div>
      </div>

      <div class="card">
        <h2 id="t-sources"></h2>
        <ul class="src-list" id="sources"></ul>
      </div>
    </div>
  </div>
</div>

<footer id="footer"></footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const COP = __COP_DATA__;

/* ================= i18n ================= */
const I18N = {
  en: {
    brand: "OPEN SAR-COP · DISASTER COMMON OPERATING PICTURE",
    map: "Situation Map",
    mapHint: "(approximate locations · click a marker for details · click the legend to toggle layers)",
    summary: "Incident Overview",
    chart: "Casualty Trend",
    chartNote: "Only figures with an explicit timestamp and attribution are plotted; missing points are not interpolated.",
    timeline: "Timeline",
    resources: "Response Forces",
    sources: "Data Sources",
    legend: "Layers",
    corridor: "Risk corridor",
    status: { active: "Active response", monitoring: "Monitoring", closed: "Closed" },
    sev: { extreme: "Extreme", severe: "Severe", moderate: "Moderate", minor: "Minor" },
    sevLabel: "Severity",
    meta: { type: "Type", onset: "Onset", region: "Region", updated: "Data as of", slug: "Event ID" },
    dead: "Dead", missing: "Missing",
    tasks: "Tasks", strength: "Strength", base: "Base",
    asOf: "as of",
    approxNote: "approximate location",
    noneRecorded: "No records yet.",
    disclaimer: "Disclaimer: this COP was generated automatically on",
    disclaimerTail: "from publicly reported information. It is for situational awareness only and must not be the sole basis for any rescue decision. It contains no personally identifiable information (PII).",
    langBtn: "中文",
    htmlLang: "en"
  },
  zh: {
    brand: "OPEN SAR-COP · 灾害通用态势平台",
    map: "态势地图",
    mapHint: "（点位为近似定位 · 点击查看详情 · 点击图例切换图层）",
    summary: "事件概况",
    chart: "伤亡数字变化",
    chartNote: "数据点仅收录有明确时间戳与口径的公开通报，缺失点不插值。",
    timeline: "时间线",
    resources: "响应力量",
    sources: "数据来源",
    legend: "图层",
    corridor: "风险廊道",
    status: { active: "响应进行中", monitoring: "持续监测", closed: "已结束" },
    sev: { extreme: "极端", severe: "严重", moderate: "中等", minor: "较轻" },
    sevLabel: "灾害等级",
    meta: { type: "类型", onset: "发生时间", region: "区域", updated: "数据更新", slug: "事件编号" },
    dead: "遇难", missing: "失联",
    tasks: "任务", strength: "规模", base: "基地",
    asOf: "信息截至",
    approxNote: "坐标为近似定位",
    noneRecorded: "暂无记录",
    disclaimer: "免责声明：本 COP 由",
    disclaimerTail: "自动生成，数据整理自公开报道，仅供态势参考，不作为救援决策的唯一依据；不含任何个人身份信息（PII）。",
    langBtn: "EN",
    htmlLang: "zh-CN"
  }
};
const CATS = {
  incident:  { color: "#dc2626" },
  damage:    { color: "#ea580c" },
  community: { color: "#d97706" },
  command:   { color: "#4338ca" },
  resource:  { color: "#0d9488" },
  risk:      { color: "#7c3aed" }
};
const CAT_I18N = {
  en: { incident: "Incident site", damage: "Damaged infrastructure", community: "Affected community", command: "Command / coordination", resource: "Response asset", risk: "Risk zone" },
  zh: { incident: "灾害发生点", damage: "设施损毁", community: "受灾村镇", command: "指挥/协调", resource: "救援力量", risk: "风险区" }
};

let LANG = localStorage.getItem("cop-lang") || "en";
if (LANG !== "en" && LANG !== "zh") LANG = "en";
function T() { return I18N[LANG]; }
/* Pick obj[field] in current language; fall back to primary field, then *_zh. */
function L(obj, field) {
  if (!obj) return "";
  if (LANG === "zh") {
    if (obj[field + "_zh"]) return obj[field + "_zh"];
  }
  if (obj[field]) return obj[field];
  if (obj[field + "_zh"]) return obj[field + "_zh"]; /* data only has zh */
  return "";
}
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

/* ================= rendering ================= */
function renderChrome() {
  var t = T();
  document.documentElement.lang = t.htmlLang;
  document.title = L(COP, "title") + " · COP";
  document.getElementById("lang-btn").textContent = t.langBtn;
  document.getElementById("brand").textContent = t.brand;
  document.getElementById("t-map").textContent = t.map;
  document.getElementById("t-map-hint").textContent = t.mapHint;
  document.getElementById("t-summary").textContent = t.summary;
  document.getElementById("t-chart").textContent = t.chart;
  document.getElementById("t-chart-note").textContent = t.chartNote;
  document.getElementById("t-timeline").textContent = t.timeline;
  document.getElementById("t-resources").textContent = t.resources;
  document.getElementById("t-sources").textContent = t.sources;

  document.getElementById("ev-title").textContent = L(COP, "title");
  document.getElementById("ev-status").innerHTML =
    '<span class="pill ' + (COP.status === "monitoring" ? "monitoring" : COP.status === "closed" ? "closed" : "active") + '">' +
    esc(t.status[COP.status] || COP.status) + "</span>" +
    '<span class="pill ' + (COP.severity || "mod") + '">' + esc(t.sevLabel) + "：" + esc(t.sev[COP.severity] || COP.severity) + "</span>";
  document.getElementById("ev-meta").innerHTML =
    "<span>" + esc(t.meta.type) + " <b>" + esc(L(COP, "event_type")) + "</b></span>" +
    "<span>" + esc(t.meta.onset) + " <b>" + esc(COP.onset) + "</b></span>" +
    (COP.region ? "<span>" + esc(t.meta.region) + " <b>" + esc(L(COP, "region")) + "</b></span>" : "") +
    "<span>" + esc(t.meta.updated) + " <b>" + esc(COP.last_updated) + "</b></span>" +
    "<span>" + esc(t.meta.slug) + " <b>" + esc(COP.slug) + "</b></span>";
  document.getElementById("ev-summary").textContent = L(COP, "summary") || "";
  document.getElementById("footer").innerHTML =
    LANG === "zh"
      ? '<b>免责声明</b>：本 COP 由 <span id="gen-time"></span> 自动生成，数据整理自公开报道，仅供态势参考，不作为救援决策的唯一依据；不含任何个人身份信息（PII）。'
      : '<b>Disclaimer</b>: this COP was generated automatically on <span id="gen-time"></span> from publicly reported information. It is for situational awareness only and must not be the sole basis for any rescue decision. It contains no personally identifiable information (PII).';
  document.getElementById("gen-time").textContent = new Date().toLocaleString(LANG === "zh" ? "zh-CN" : "en-US");
}

function renderKpis() {
  document.getElementById("kpis").innerHTML = (COP.kpis || []).map(function (k) {
    return '<div class="kpi"><div class="v">' + esc(k.value) + (k.unit ? "<small>" + esc(k.unit) + "</small>" : "") +
      '</div><div class="l">' + esc(L(k, "label")) + "</div>" +
      (L(k, "note") ? '<div class="n">' + esc(L(k, "note")) + "</div>" : "") + "</div>";
  }).join("");
}

function renderChart() {
  var t = T();
  var series = (COP.casualty_series || []).filter(function (p) { return p.dead != null || p.missing != null; });
  var card = document.getElementById("chart-card");
  card.style.display = "";
  if (!series.length) { card.style.display = "none"; return; }
  var W = 340, H = 180, Lm = 40, R = 12, Tm = 14, B = 26;
  var max = 0;
  series.forEach(function (p) { max = Math.max(max, p.dead || 0, p.missing || 0); });
  max = Math.ceil(max / 100) * 100 || 10;
  function x(i) { return Lm + (series.length === 1 ? 0 : i * (W - Lm - R) / (series.length - 1)); }
  function y(v) { return H - B - v * (H - Tm - B) / max; }
  var svg = '<svg viewBox="0 0 ' + W + " " + H + '" style="width:100%;height:auto">';
  for (var g = 0; g <= 4; g++) {
    var gv = max * g / 4;
    svg += '<line x1="' + Lm + '" y1="' + y(gv) + '" x2="' + (W - R) + '" y2="' + y(gv) + '" stroke="#e5e7eb" stroke-width="1"/>' +
      '<text x="' + (Lm - 6) + '" y="' + (y(gv) + 4) + '" font-size="10" fill="#9ca3af" text-anchor="end">' + gv + "</text>";
  }
  function line(key, color) {
    var pts = [], dots = "";
    series.forEach(function (p, i) {
      if (p[key] == null) return;
      pts.push(x(i) + "," + y(p[key]));
      dots += '<circle cx="' + x(i) + '" cy="' + y(p[key]) + '" r="3.5" fill="' + color + '">' +
        "<title>" + esc(L(p, "label")) + "：" + p[key] + "</title></circle>";
    });
    if (pts.length < 2) return dots;
    return '<polyline points="' + pts.join(" ") + '" fill="none" stroke="' + color + '" stroke-width="2.2"/>' + dots;
  }
  svg += line("missing", "#d97706") + line("dead", "#dc2626");
  series.forEach(function (p, i) {
    svg += '<text x="' + x(i) + '" y="' + (H - 8) + '" font-size="10" fill="#6b7280" text-anchor="middle">' + esc(L(p, "label")) + "</text>";
  });
  var legW = LANG === "zh" ? [118, 62] : [128, 66];
  svg += '<rect x="' + (W - legW[0]) + '" y="2" width="12" height="3.5" fill="#dc2626"/><text x="' + (W - legW[0] + 16) + '" y="8" font-size="10.5" fill="#374151">' + esc(t.dead) + "</text>" +
    '<rect x="' + (W - legW[1]) + '" y="2" width="12" height="3.5" fill="#d97706"/><text x="' + (W - legW[1] + 16) + '" y="8" font-size="10.5" fill="#374151">' + esc(t.missing) + "</text>";
  svg += "</svg>";
  document.getElementById("chart").innerHTML = svg;
}

function renderTimeline() {
  document.getElementById("timeline").innerHTML = (COP.updates || []).map(function (u) {
    return '<div class="tl-item"><span class="tl-time">' + esc(u.time) + "</span>" +
      (L(u, "tag") ? '<span class="tl-tag">' + esc(L(u, "tag")) + "</span>" : "") +
      '<div class="tl-text">' + esc(L(u, "text")) + "</div></div>";
  }).join("");
}

function renderResources() {
  var t = T();
  document.getElementById("resources").innerHTML = (COP.resources || []).map(function (r) {
    return '<div class="res-item"><span class="res-name">' + esc(L(r, "name")) + "</span>" +
      (L(r, "type") ? '<span class="res-type">' + esc(L(r, "type")) + "</span>" : "") +
      "<div class='res-detail'>" +
      (L(r, "tasks") ? esc(t.tasks) + "：" + esc(L(r, "tasks")) + "；" : "") +
      (L(r, "strength") ? esc(t.strength) + "：" + esc(L(r, "strength")) + "；" : "") +
      (L(r, "base") ? esc(t.base) + "：" + esc(L(r, "base")) : "") + "</div></div>";
  }).join("") || '<div style="padding:10px 16px;color:#6b7280">' + esc(t.noneRecorded) + "</div>";
}

function renderSources() {
  document.getElementById("sources").innerHTML = (COP.sources || []).map(function (s) {
    var name = s.url ? '<a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(L(s, "name")) + "</a>" : esc(L(s, "name"));
    return "<li>" + name + (s.date ? "（" + esc(s.date) + "）" : "") + "</li>";
  }).join("");
}

/* ================= map ================= */
var map, layerRecords = {}, markerPopups = [];

function catLabel(key) { return CAT_I18N[LANG][key] || key; }

function buildMap() {
  var t = T();
  map = L.map("map", { scrollWheelZoom: true }).setView([27.95, 85.0], 8);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 17,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);

  layerRecords = {};
  var allBounds = [];

  if (COP.corridor && COP.corridor.coords && COP.corridor.coords.length) {
    var corr = L.polyline(COP.corridor.coords, {
      color: "#dc2626", weight: 4, opacity: .75, dashArray: "10 8"
    }).addTo(map);
    corr.bindPopup("<b>" + esc(L(COP.corridor, "name")) + "</b><br>" + esc(L(COP.corridor, "note") || ""));
    layerRecords.__corridor = { layer: L.layerGroup([corr]).addTo(map), key: "__corridor", color: "#dc2626" };
    allBounds.push(corr.getBounds());
  }

  Object.keys(CATS).forEach(function (key) {
    var group = L.layerGroup();
    (COP.sites || []).forEach(function (s) {
      if (s.category !== key) return;
      var m = L.circleMarker([s.lat, s.lon], {
        radius: key === "incident" ? 12 : 8,
        color: "#fff", weight: 2, fillColor: CATS[key].color, fillOpacity: key === "incident" ? .55 : .9
      }).addTo(group);
      markerPopups.push({ marker: m, site: s, cat: key });
      allBounds.push(L.latLngBounds([s.lat, s.lon], [s.lat, s.lon]));
    });
    if (key === "incident") {
      (COP.sites || []).filter(function (s) { return s.category === "incident"; }).forEach(function (s) {
        L.circle([s.lat, s.lon], { radius: 8000, color: "#dc2626", weight: 1, fillOpacity: .08 }).addTo(group);
      });
    }
    if (group.getLayers().length) {
      group.addTo(map);
      layerRecords[key] = { layer: group, key: key, color: CATS[key].color };
    }
  });

  if (allBounds.length) { map.fitBounds(L.latLngBounds(allBounds).pad(0.25)); }
  refreshPopups();
  buildLegend();
}

function refreshPopups() {
  markerPopups.forEach(function (p) {
    var cat = CATS[p.cat];
    p.marker.bindPopup(
      '<div class="pop-name">' + esc(L(p.site, "name")) + "</div>" +
      '<span class="pop-cat" style="background:' + cat.color + '">' + esc(catLabel(p.cat)) + "</span><br>" +
      esc(L(p.site, "description") || "") +
      (p.site.as_of ? '<br><span style="color:#6b7280;font-size:11px">' + esc(T().asOf) + " " + esc(p.site.as_of) + "</span>" : "")
    );
  });
}

function buildLegend() {
  var t = T();
  var legend = L.control({ position: "bottomright" });
  legend.onAdd = function () {
    var div = L.DomUtil.create("div", "legend");
    var html = "<b style='font-size:11px'>" + esc(t.legend) + "</b>";
    Object.keys(layerRecords).forEach(function (key) {
      var it = layerRecords[key];
      var label = key === "__corridor" ? t.corridor : catLabel(key);
      html += '<div class="row" data-key="' + key + '"><span class="dot" style="background:' + it.color + '"></span>' + esc(label) + "</div>";
    });
    div.innerHTML = html;
    L.DomEvent.disableClickPropagation(div);
    return div;
  };
  legend.addTo(map);
  map.whenReady(function () {
    document.querySelectorAll(".legend .row").forEach(function (row) {
      row.addEventListener("click", function () {
        var it = layerRecords[row.dataset.key];
        if (map.hasLayer(it.layer)) { map.removeLayer(it.layer); row.classList.add("off"); }
        else { map.addLayer(it.layer); row.classList.remove("off"); }
      });
    });
  });
}

/* ================= language toggle ================= */
function toggleLang() {
  LANG = LANG === "en" ? "zh" : "en";
  localStorage.setItem("cop-lang", LANG);
  renderChrome(); renderKpis(); renderChart(); renderTimeline(); renderResources(); renderSources();
  refreshPopups();
  /* rebuild legend labels in place */
  var legendEl = document.querySelector(".legend");
  if (legendEl) {
    var t = T();
    var html = "<b style='font-size:11px'>" + esc(t.legend) + "</b>";
    Object.keys(layerRecords).forEach(function (key) {
      var it = layerRecords[key];
      var off = map.hasLayer(it.layer) ? "" : " off";
      var label = key === "__corridor" ? t.corridor : catLabel(key);
      html += '<div class="row' + off + '" data-key="' + key + '"><span class="dot" style="background:' + it.color + '"></span>' + esc(label) + "</div>";
    });
    legendEl.innerHTML = html;
    legendEl.querySelectorAll(".row").forEach(function (row) {
      row.addEventListener("click", function () {
        var it = layerRecords[row.dataset.key];
        if (map.hasLayer(it.layer)) { map.removeLayer(it.layer); row.classList.add("off"); }
        else { map.addLayer(it.layer); row.classList.remove("off"); }
      });
    });
  }
}

/* ================= init ================= */
renderChrome();
renderKpis();
renderChart();
renderTimeline();
renderResources();
renderSources();
buildMap();
</script>
